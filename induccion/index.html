<!-- 📡 LA VACUNA Y DETECTOR REACTIVO GURU OS -->
<script>
function desplegarArmaduraLocal() {
    if (!window.tailwindAsfixiaTriggered) {
        window.tailwindAsfixiaTriggered = true;
        console.warn("⚠️ GURU OS: ¡Alerta de asfixia detectada! Activando contingencia...");
        document.documentElement.classList.add('no-tailwind');
        
        // Cargamos el Tailwind Local de su servidor de respaldo para compilar offline
        var localTailwind = document.createElement('script');
        localTailwind.src = '/tailwind.js';
        localTailwind.onload = function() {
            console.log("🚀 GURU OS: ¡Tailwind local cargado con éxito!");
            document.documentElement.classList.remove('no-tailwind');
        };
        document.head.appendChild(localTailwind);
    }
}

// Respaldo síncrono si el CDN se congela silenciosamente en F12
setTimeout(function() {
    if (typeof tailwind === 'undefined' || !window.tailwindLoaded || Object.keys(tailwind).length <= 1) {
        desplegarArmaduraLocal();
    }
}, 1500);
</script>
